name: Playback source check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/playback-check.yml'
      - 'src/lib/providers/tvwiki.ts'
      - 'tests/tvwiki-playback-live.cjs'

permissions:
  contents: read

jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node tests/tvwiki-playback-live.cjs
        env:
          PLAYBACK_DIAGNOSTICS: '1'
